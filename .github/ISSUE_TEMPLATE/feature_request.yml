name: Feature request
description: Suggest a new capability or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      placeholder: e.g. "Keyboard shortcut to pull playback back from the phone."
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why is it useful?
      placeholder: What does this make easier? Who benefits?
    validations:
      required: true
